spring.datasource.url=${DB_URL:jdbc:h2:file:./data/validation;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
flowable.database-schema-update=true
flowable.async-executor-activate=${ASYNC_ENABLED:true}
flowable.history-level=full
flowable.process.async.executor.default-async-job-acquire-wait-time=100
flowable.process.async.executor.default-timer-job-acquire-wait-time=100
logging.level.org.flowable=warn
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=4
flowable.idm.enabled=false
flowable.eventregistry.enabled=false
